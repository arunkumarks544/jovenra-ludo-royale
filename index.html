.dice-platform {background:radial-gradient(ellipse at 25% 42%,#ecc17523,transparent 45%),radial-gradient(ellipse at 90% 100%,#25385455,transparent 44%),linear-gradient(125deg,#111e35,#080f1c);border:1px solid #edce9264;overflow:visible;box-shadow:inset 0 1px 0 #f9dc9b18,0 9px 25px #0005;}
.dice-platform:before {content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,#fffff409,transparent 42%);}
.die-stage {position:absolute;z-index:0;left:17px;top:50%;width:117px;height:93px;transform:translateY(-35%) rotateX(53deg);border:1px solid #c6974fa8;border-radius:50%;background:radial-gradient(ellipse at 44% 39%,#9b65361c,#101722 60%,#0a0c17 67%),conic-gradient(from 0deg,#e6b76d,#624120,#dbb879,#70512a,#dab778,#755129,#e6b76d);box-shadow:0 12px 11px #000b,inset 0 0 0 3px #141d29,inset 0 0 0 6px #dfbd767d,inset 0 0 0 9px #241c17;pointer-events:none;}
.die-stage-ring {position:absolute;inset:14%;border:1px solid #ffdda54c;border-radius:50%;box-shadow:inset 0 0 13px #f4bd7442;}
.die-stage-center {position:absolute;inset:30%;border-radius:50%;background:#dcba7255;box-shadow:0 0 22px #f5ce8b60;}
.die-shadow {left:39px;bottom:14px;background:#040609e0;filter:blur(14px);width:60px;height:20px;}
.die-altar {position:absolute;left:6px;top:10px;width:133px;height:132px;pointer-events:none;border:1px dotted #f1cd8a22;border-radius:50%;animation:dieAltarRot 26s linear infinite;}
.die-altar i {position:absolute;width:5px;height:5px;background:#f8cb80;border-radius:50%;box-shadow:0 0 10px #ffdc93;top:0;left:50%;}.die-altar i:nth-child(2){top:auto;bottom:0;left:45%}.die-altar i:nth-child(3){left:4px;top:55%}
@keyframes dieAltarRot{to{transform:rotate(360deg)}}
.dice-platform.result-reveal:after {content:'✦';position:absolute;top:3px;left:72px;font-size:25px;color:#fff0bf;text-shadow:0 0 12px #ffcc73,0 0 30px #f2b665;animation:resultGlint .56s ease-out both;pointer-events:none;}
@keyframes resultGlint {from{opacity:0;transform:translateY(16px) scale(.3) rotate(0deg)}42%{opacity:1}to{opacity:0;transform:translateY(-38px) scale(1.6) rotate(100deg)}}
.dock-die .die-face{border-radius:11px}.dock-die .die-perspective{transform:rotateX(-15deg) rotateY(-17deg)}
.audio-tools {display:flex;align-items:center;gap:9px}
.music-button {min-height:38px;display:flex;align-items:center;gap:10px;justify-content:center;border:1px solid #dfb87860;border-radius:10px;padding:0 14px;color:#d9c3a5;background:linear-gradient(130deg,#262333d6,#161d2ed6);font-weight:850;letter-spacing:1.1px;font-size:9px;box-shadow:inset 0 1px 0 #f9dfa21c;transition:border-color .25s,background .25s}
.music-button:hover,.music-button.active{border-color:#e1bf7e9c;background:linear-gradient(135deg,#34302e,#1a2532)}
.music-button.active .music-name{color:#f7d99f}
.equalizer,.soundwave{display:flex;align-items:center;gap:3px;height:22px}
.equalizer i,.soundwave i{width:3px;height:8px;border-radius:4px;background:linear-gradient(#fff3c8,#ba8854);animation:equalize 950ms ease-in-out infinite alternate}
.equalizer i:nth-child(2),.soundwave i:nth-child(2){height:16px;animation-delay:-640ms}.equalizer i:nth-child(3),.soundwave i:nth-child(3){height:12px;animation-delay:-350ms}.equalizer i:nth-child(4),.soundwave i:nth-child(4){height:19px;animation-delay:-760ms}.soundwave i:nth-child(5){height:9px;animation-delay:-270ms}
.music-button:not(.active) .equalizer i{animation-play-state:paused;height:3px;background:#83818a}
@keyframes equalize{to{height:5px;opacity:.65}}
.soundtrack-promise{max-width:490px;display:flex;gap:12px;align-items:center;padding:13px 16px;margin-top:6px;border:1px solid #a98f5a53;border-radius:12px;background:linear-gradient(90deg,#f7d48e0e,#1522357b);box-shadow:inset 0 0 19px #b18b4a0e}
.soundtrack-mark{width:31px;height:31px;flex-shrink:0;display:grid;place-items:center;border-radius:50%;color:#f0d08f;font-size:18px;background:#edbd7440;box-shadow:0 0 17px #e0ae4e36}
.soundtrack-promise>span:nth-child(2){display:grid;gap:4px;min-width:0}
.soundtrack-promise b{font-size:9px;letter-spacing:1.7px;color:#f5e4c6}
.soundtrack-promise small{font-size:10px;color:#a8b4c9;line-height:1.35}
.soundtrack-promise .soundwave{margin-left:auto;flex-shrink:0}
.stardust {position:absolute;inset:0;opacity:.55;pointer-events:none;background-image:radial-gradient(circle at 12% 15%,#ecd4ac 0 1px,transparent 2px),radial-gradient(circle at 58% 36%,#ffffff 0 1px,transparent 2px),radial-gradient(circle at 72% 75%,#ecd4ac 0 2px,transparent 3px),radial-gradient(circle at 32% 80%,#ffffff 0 1px,transparent 2px);background-size:287px 197px;animation:stardustDrift 21s linear infinite;}
@keyframes stardustDrift {to{background-position:142px -126px}}
.royal-watermark{position:absolute;right:-95px;top:18%;color:#d3a86b0a;font:650px/1 Georgia,serif;transform:rotate(-18deg);text-shadow:0 0 40px #bd9a6111;pointer-events:none}
.gold-tracery{position:absolute;width:300px;height:300px;border:1px solid #dcad6121;border-radius:50%;transform:rotate(40deg);pointer-events:none}
.gold-tracery:before,.gold-tracery:after{content:'';position:absolute;inset:18px;border:1px solid #d7a86721;border-radius:50%}.gold-tracery:after{inset:58px}
.gold-tracery-left{left:-230px;top:360px}.gold-tracery-right{right:-250px;bottom:210px}
.launch-crest {position:absolute;top:115px;right:10%;font-size:35px;color:#ffdc9170;pointer-events:none;text-shadow:0 0 26px #f7c270aa;animation:crestPulse 4s ease-in-out infinite alternate}
@keyframes crestPulse {to{opacity:.35;transform:scale(.7) rotate(45deg)}}
.hero-copy h1{filter:drop-shadow(0 0 28px #f0c67c19)}
.gold-button,.roll-action{position:relative;overflow:hidden}
.gold-button:before,.roll-action:before{content:'';position:absolute;top:-55%;left:-65%;width:24%;height:230%;background:linear-gradient(90deg,transparent,#fff8,transparent);transform:rotate(24deg);animation:buttonShine 7s ease-in-out infinite;pointer-events:none}
@keyframes buttonShine{0%,22%{left:-65%;opacity:0}29%{opacity:.65}49%,100%{left:145%;opacity:0}}
.board-panel{background:linear-gradient(120deg,#26344a,#101827 38%,#0b1323);box-shadow:0 30px 70px #0008,0 0 0 1px #f3ca7c16,inset 0 1px 0 #f6d28e34}
.board-metal{box-shadow:inset 0 0 0 2px #f2cd7730,inset 0 0 16px #0009,0 0 29px #dfb56a1c}
.board-outer {position:relative}.board-outer:after{content:'';position:absolute;inset:7px;border-radius:12px;border:1px solid #ffffff25;pointer-events:none;z-index:14}
.base-crest{filter:drop-shadow(0 2px 8px #68451a66)}
.section-card{box-shadow:0 16px 50px #0007,inset 0 1px 0 #e9c68a19}
.player-card.current-turn{box-shadow:0 0 0 1px #f6d09358,0 0 28px #f0ac5b21,inset 0 1px 0 #fff1}
.piece-ready .piece-aura{animation:piecePulse 880ms ease-in-out infinite alternate}
@keyframes piecePulse{to{opacity:1;transform:scale(1.16)}}
@media(max-width:1050px){.header-right{gap:10px}.music-button{padding:0 9px}.music-name{font-size:8px}}
@media(max-width:680px){.audio-tools{gap:6px}.music-button{padding:0 9px;min-height:35px}.music-name{display:none}.music-button .equalizer{width:18px}.soundtrack-promise{margin-top:13px;padding:11px 12px;gap:8px}.soundtrack-promise small{font-size:9px}.soundtrack-promise b{font-size:8px}.hero-stats{margin-top:22px}.die-stage{display:none}.die-altar{display:none}.die-cube{will-change:transform}}
@media(prefers-reduced-motion:reduce){.stardust,.die-altar,.equalizer i,.soundwave i,.gold-button:before,.roll-action:before,.launch-crest{animation:none!important}}

 if(board&&origin){origin.style.visibility='hidden';const avatar=document.createElement('div');avatar.className='traveler';avatar.innerHTML=pieceMarkup(owner,index,false);avatar.querySelector('button').removeAttribute('data-piece');avatar.querySelector('button').setAttribute('tabindex','-1');avatar.querySelector('button').disabled=true;board.append(avatar);
 for(let i=0;i<steps;i++){if(!game||page!=='match')break;const start= i===0?prior:(prior===-1?0:prior+i);const end=prior===-1?0:prior+i+1;const a=gameLocation(owner,start,index),b=gameLocation(owner,end,index);const msg=app.querySelector('[data-hop-counter]');if(msg)msg.textContent=`${NAMES[owner]} IS LEAPING · ${i+1} / ${steps}`;moveLog.push({player:owner,token:index,from:a,to:b,step:i+1,total:steps});await hop(board,avatar,a,b,prior===-1?430:250);}
 avatar.remove();}
 else await wait(150);
 if(!game||page!=='match'){moving=false;return;}
 const before=game.tokens.map(a=>a.slice());game=resolveMove(game,index);moving=false;save();render('match');const captured=before.some((arr,p)=>p!==owner&&arr.some((v,i)=>v!==-1&&game.tokens[p][i]===-1));if(captured){sparkAtCurrent('gold',20);chime(950,.25,.12);}if(game.winner!==null){soundWin();confetti();}
}
function confetti(){const root=document.querySelector('#fx-overlay');if(!root||REDUCED)return;for(let i=0;i<80;i++){const b=document.createElement('span');b.className='confetti';b.style.left=`${Math.random()*100}%`;b.style.top='-10%';b.style.setProperty('--dx',`${Math.random()*180-90}px`);b.style.setProperty('--spin',`${Math.random()*900}deg`);b.style.setProperty('--dur',`${2+Math.random()*2}s`);b.style.background=['#f0cf88','#f76b89','#459ef9','#41d5a5','#fff'][i%5];root.append(b);setTimeout(()=>b.remove(),4500);}}
function queueBot(){clearTimeout(bottimer);if(page!=='match'||!game||game.winner!==null||rolling||moving||game.types[game.current]!=='bot')return;bottimer=setTimeout(()=>{if(!game||page!=='match'||rolling||moving||game.types[game.current]!=='bot')return;if(game.phase==='roll')diceRoll();else if(game.phase==='move'){const t=chooseBotMove(game);if(t!==null)pawnMove(t);}},game.phase==='roll'?1450:600);}
function startMatch(){const els=[...document.querySelectorAll('[data-config]')],types=els.map(e=>e.disabled?'human':e.value);if(!validConfig(types)){document.querySelector('#setup-warning').textContent='At least two active players are needed.';return;}game=newGame(types);rolling=false;moving=false;dieValue=1;moveLog=[];save();chime(720,.2);render('match');}
app.addEventListener('click',e=>{const previouslyUnlocked=audioUnlocked;unlockAudio();const piece=e.target.closest('[data-piece]');if(piece){if(canMove()){const [p,t]=piece.dataset.piece.split(':').map(Number);if(p===game.current)pawnMove(t);}return;}const btn=e.target.closest('[data-action]');if(!btn)return;if(btn.tagName==='A')e.preventDefault();const a=btn.dataset.action;if(a==='home')render('home');else if(a==='setup')render('setup');else if(a==='guide')render('guide');else if(a==='resume'&&game)render('match');else if(a==='sound'){fxOn=!fxOn;persistAudio();render();}else if(a==='music'){if(previouslyUnlocked||!musicOn)musicOn=!musicOn;persistAudio();syncAudio();render();}else if(a==='start')startMatch();else if(a==='roll'&&canRoll())diceRoll();else if(a==='restart'&&game){if(window.confirm('Start a new match with the same players?')){game=newGame(game.types);dieValue=1;rolling=false;moving=false;moveLog=[];save();render('match');}}});
// Test hooks are restricted to a locally served development version, not a deployed site.
if(['localhost','127.0.0.1'].includes(window.location.hostname)){window.__jovenraDebug={getState:()=>structuredClone(game),getLastDie:()=>dieValue,getHops:()=>moveLog.slice(),getFlags:()=>({rolling,moving}),getAudio:()=>({musicOn,fxOn,unlocked:audioUnlocked,playing:!ambient.paused}),getDieAngles:()=>structuredClone(ANGLES),roll:()=>diceRoll(),move:i=>pawnMove(i),start:(types=['human','off','off','bot'])=>{game=newGame(types);dieValue=1;save();render('match');}};}
render();

// Resume audio only while the tab is visible; a user gesture is required by browsers.
document.addEventListener('visibilitychange',()=>{if(document.hidden)ambient.pause();else syncAudio()});
</script></body></html>
